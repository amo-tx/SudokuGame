name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon --console=plain

    - name: Build release APK
      run: ./gradlew assembleRelease --no-daemon --console=plain

    - name: Rename release APK
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        cd app/build/outputs/apk/release/
        for f in app-release-unsigned.apk app-release.apk app-release-signed.apk; do
          if [ -f "$f" ]; then
            mv "$f" "sudoku-game-${{ github.ref_name }}.apk"
            echo "Renamed $f to sudoku-game-${{ github.ref_name }}.apk"
            break
          fi
        done
        ls -la *.apk || true

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: sudoku-game-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 90

    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: sudoku-game-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 90

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete ${{ github.ref_name }} --yes --cleanup-tag || true
        gh release create ${{ github.ref_name }} \
          --title "${{ github.ref_name }} - Sudoku Game" \
          --notes "## Sudoku Game ${{ github.ref_name }}

        ### Features
        - Sudoku generation and solving (backtracking + MRV heuristic)
        - Handwritten digit recognition (ONNX CNN, camera/gallery)
        - Light/Dark/System theme switching
        - Pause menu, save/load game state
        - 3-mistake game over, real-time hints

        ### Tech Stack
        - Kotlin + MVVM
        - ONNX Runtime
        - Material Design DayNight
        - GitHub Actions CI/CD

        ### Download
        - sudoku-game-${{ github.ref_name }}.apk - Release APK
        - Minimum: Android 7.0 (API 24)" \
          app/build/outputs/apk/release/sudoku-game-*.apk