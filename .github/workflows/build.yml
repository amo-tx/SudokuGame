name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon --console=plain

    - name: Build release APK
      run: ./gradlew assembleRelease --no-daemon --console=plain

    - name: Rename release APK
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        cd app/build/outputs/apk/release/
        for f in app-release-unsigned.apk app-release.apk; do
          [ -f "$f" ] && mv "$f" "sudoku-game-${{ github.ref_name }}.apk"
        done

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: sudoku-game-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 90

    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: sudoku-game-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 90

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }} - Sudoku Game
        body: |
          ## Sudoku Game ${{ github.ref_name }}

          ### Features
          - Sudoku generation and solving (backtracking + MRV heuristic)
          - Handwritten digit recognition (ONNX CNN, camera/gallery)
          - Light/Dark/System theme switching
          - Pause menu, save/load game state
          - 3-mistake game over, real-time hints

          ### Tech Stack
          - Kotlin + MVVM
          - ONNX Runtime
          - Material Design DayNight
          - GitHub Actions CI/CD

          ### Download
          - `sudoku-game-${{ github.ref_name }}.apk` - Release APK
          - Minimum: Android 7.0 (API 24)
        files: |
          app/build/outputs/apk/release/sudoku-game-*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}