name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release APK
      run: ./gradlew assembleRelease --no-daemon --console=plain

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: sudoku-game-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release APK
      run: ./gradlew assembleRelease --no-daemon --console=plain

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_apk
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "35.0.0"

    - name: Rename APK
      run: |
        mv ${{ steps.sign_apk.outputs.signedReleaseFile }} app/build/outputs/apk/release/sudoku-game-${{ github.ref_name }}.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Sudoku Game ${{ github.ref_name }}
        body: |
          ## Sudoku Game Android App ${{ github.ref_name }}

          ### Features
          - Random puzzle generation with 4 difficulty levels
          - Number highlighting and remaining count display
          - Auto-solve with backtracking + MRV heuristic
          - Hint system, note mode, error detection
          - Timer and game statistics

          ### Installation
          Download the APK below and install on your Android device (Android 7.0+).
        files: |
          app/build/outputs/apk/release/*.apk
        generate_release_notes: true